name = "poetic-codes"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "commonplace"
database_id = "PASTE-YOUR-D1-ID-HERE"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "commonplace-media"
