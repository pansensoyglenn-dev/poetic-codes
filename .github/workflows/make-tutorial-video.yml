name: Make tutorial video

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Lesson page to turn into a video (path from the repo root, e.g. python-operators.html)"
        default: "python-operators.html"
      narration:
        description: "Narration file in the video/ folder, without .py (narration = Numbers, narration_operators = Operators)"
        default: "narration_operators"
      video_name:
        description: "File name on the website (saved in the videos/ folder)"
        default: "python-operators-tutorial.mp4"
      voice:
        description: "Narrator voice (en-US-AndrewNeural, en-US-GuyNeural, en-GB-RyanNeural, en-US-AriaNeural ...)"
        default: "en-US-AndrewNeural"
      rate:
        description: "Speaking speed (e.g. -4% is slightly slower than normal)"
        default: "-4%"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install edge-tts pillow pygments beautifulsoup4 lxml
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Build the video
        working-directory: video
        env:
          PAGE: ${{ github.event.inputs.page }}
          NARRATION: ${{ github.event.inputs.narration }}
          VOICE: ${{ github.event.inputs.voice }}
          RATE: ${{ github.event.inputs.rate }}
        run: |
          if [ ! -f "../$PAGE" ]; then
            echo "ERROR: the lesson page '$PAGE' is not in this repo."
            echo "Pages that look like it:"
            (cd .. && find . -iname 'python-numbers*.html' -not -path './.git/*' | head -20)
            echo "Run the workflow again and type the correct path in the 'page' box."
            exit 1
          fi
          python build_video.py "../$PAGE" --out ../out
      - name: Make the web copy (small enough for Cloudflare Pages, limit 25 MiB per file)
        run: |
          SRC=out/tutorial.mp4; DST=out/tutorial-portal.mp4; LIMIT=23500000
          for MR in 600 450 350 270 200 150; do
            ffmpeg -y -loglevel error -i "$SRC" -c:v libx264 -preset medium -crf 28 -maxrate ${MR}k -bufsize $((MR*2))k \
              -pix_fmt yuv420p -c:a aac -b:a 64k -ac 1 -movflags +faststart "$DST"
            SIZE=$(stat -c %s "$DST")
            echo "maxrate=${MR}k -> ${SIZE} bytes"
            if [ "$SIZE" -le "$LIMIT" ]; then echo "OK: web copy is $((SIZE/1024/1024)) MiB"; exit 0; fi
          done
          echo "ERROR: could not make the video small enough for Cloudflare Pages."; exit 1
      - name: Put the video on the website (commit to videos/)
        env:
          VNAME: ${{ github.event.inputs.video_name }}
        run: |
          VNAME=$(echo "$VNAME" | xargs)
          case "$VNAME" in *.mp4) ;; *) VNAME="$VNAME.mp4";; esac
          mkdir -p videos
          cp out/tutorial-portal.mp4 "videos/$VNAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "videos/$VNAME"
          if git diff --cached --quiet; then echo "Video unchanged, nothing to commit."; else
            git commit -m "Add tutorial video: $VNAME"
            for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 5; done
          fi
          echo "VIDEO_URL=https://poetic-codes.pages.dev/videos/$VNAME" >> "$GITHUB_ENV"
      - name: Attach the video to the article right now (no waiting for Cloudflare Pages)
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WORKER: https://poetic-codes.pansensoyglenn150.workers.dev
          PAGE: ${{ github.event.inputs.page }}
          VNAME: ${{ github.event.inputs.video_name }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY secret is not set: skipping the article attach."; exit 0; fi
          python3 - <<'PY'
          import os, re, sys, json, time, urllib.request, urllib.parse, urllib.error
          W = os.environ["WORKER"]; K = os.environ["ADMIN_KEY"]
          def norm(x): return re.sub(r"[^a-z0-9]+", " ", x.lower()).strip()
          src = open(os.path.join("..", os.environ["PAGE"].strip()), encoding="utf-8", errors="replace").read()
          def clean(h): return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", h.replace("<br>", ": ").replace("<br/>", ": ").replace("<br />", ": "))).replace(" :", ":").strip()
          cands = []
          m = re.search(r"(?is)<h1[^>]*>(.*?)</h1>", src)
          if m: cands.append(clean(m.group(1)))
          m = re.search(r"(?is)<title[^>]*>(.*?)</title>", src)
          if m: cands.append(clean(m.group(1)))
          cands = [norm(c) for c in cands if c]
          def call(method, path, data=None, headers=None):
              h = {"X-Admin-Key": K, "User-Agent": "tutorial-video-bot/1.0"}; h.update(headers or {})
              req = urllib.request.Request(W + path, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=600) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")[:300]
                  print("Worker said HTTP %s for %s %s: %s" % (e.code, method, path.split("?")[0], body))
                  if e.code == 404:
                      print("404 means the Worker running on Cloudflare does not have this route yet: open Workers & Pages > poetic-codes > Edit code, paste the newest worker.js from your repo, and Deploy.")
                  elif e.code == 401:
                      print("401 means the ADMIN_KEY secret in GitHub is not the same as the Worker's ADMIN_KEY.")
                  sys.exit(0)
          raw = open("out/tutorial-portal.mp4", "rb").read()
          q = urllib.parse.urlencode({"contentType": "video/mp4", "filename": os.environ.get("VNAME", "tutorial.mp4")})
          url = call("POST", "/api/upload?" + q, raw, {"Content-Type": "video/mp4", "Content-Length": str(len(raw))})["url"]
          print("video is live at", url)
          rows = call("GET", "/api/articles")
          rows = rows.get("articles", rows) if isinstance(rows, dict) else rows
          row = next((r for r in rows if norm(r.get("title") or "") in cands), None)
          if not row:
              row = next((r for r in rows if any(c and (norm(r.get("title") or "").startswith(c.split(" learn python")[0]) or c.startswith(norm(r.get("title") or "")))
                          and len(norm(r.get("title") or "")) > 8 for c in cands)), None)
          if not row:
              print("No article on the Worker matches the lesson page title", cands, "- video is uploaded, but not attached."); sys.exit(0)
          payload = {"title": row["title"], "category": row["category"], "date": str(row.get("date") or "")[:10],
                     "contentType": row.get("content_type") or "html", "body": row["body"], "summary": row.get("summary") or "",
                     "tags": row.get("tags") or [], "photoUrl": row.get("photo_url"), "videoUrl": url}
          call("PUT", "/api/articles?id=" + str(row["id"]), json.dumps(payload).encode(), {"Content-Type": "application/json"})
          print("attached to article #%s" % row["id"])
          PY
      - name: Make a download link for the .mp4 (for uploading to YouTube)
        env:
          GH_TOKEN: ${{ github.token }}
          VNAME: ${{ github.event.inputs.video_name }}
        run: |
          VNAME=$(echo "$VNAME" | xargs); BASE="${VNAME%.mp4}"
          TAG="video-${BASE}-${GITHUB_RUN_NUMBER}"
          cp out/tutorial.mp4 "out/${BASE}-for-youtube.mp4"
          NOTES="Full-quality tutorial video. Tap the .mp4 file below to download it, then upload it in YouTube Studio. The title and description are in youtube_description.txt."
          gh release create "$TAG" "out/${BASE}-for-youtube.mp4" out/youtube_description.txt out/subtitles.srt out/chapters.txt \
            --title "$BASE (download for YouTube)" --notes "$NOTES"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "DOWNLOAD PAGE: $URL"
          echo "### Your .mp4 is ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this page and tap **${BASE}-for-youtube.mp4**: $URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: numbers-tutorial
          path: |
            out/tutorial.mp4
            out/tutorial-portal.mp4
            out/subtitles.srt
            out/chapters.txt
            out/youtube_description.txt
            out/narration_script.txt
