# Save in your repo as:  .github/workflows/import-articles-to-d1.yml
# Needs import_articles.sql in the repo root (same folder as index.html).
# Needs two GitHub secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# Run it once from the Actions tab: "Import articles to D1" > Run workflow.
name: Import articles to D1

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: "Exact D1 database name (Cloudflare > Storage & Databases > D1)"
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the import (safe to run twice, it skips articles that already exist)
        run: |
          DB="$(echo "$DB_NAME" | xargs)"      # trims stray spaces added by phone keyboards
          # run from an empty folder so the repo's wrangler.toml (with its placeholder database id) is ignored
          mkdir -p /tmp/d1run && cp import_articles.sql /tmp/d1run/ && cd /tmp/d1run
          npx --yes wrangler@4 d1 execute "$DB" --remote --yes --file=import_articles.sql
        env:
          DB_NAME: ${{ github.event.inputs.database_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
