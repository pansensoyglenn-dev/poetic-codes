# Save in the Poetic Bytes repo as:  .github/workflows/make-numbers-video.yml
# Repo layout needed:
#   the lesson page (python-numbers.html in the root, or articles/python-numbers.html:
#   type its path in the "page" box when you run the workflow)
#   video/build_video.py
#   video/narration.py
# Run it from the Actions tab. When it finishes, open the run and download the
# "numbers-tutorial" artifact: it contains tutorial.mp4, tutorial-portal.mp4 (under 90 MB, for the portal), subtitles.srt,
# chapters.txt and youtube_description.txt.
name: Make Numbers tutorial video

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Lesson page to turn into a video (path from the repo root, e.g. python-numbers.html or articles/python-numbers.html)"
        default: "python-numbers.html"
      voice:
        description: "Narrator voice (en-US-AndrewNeural, en-US-GuyNeural, en-GB-RyanNeural, en-US-AriaNeural ...)"
        default: "en-US-AndrewNeural"
      rate:
        description: "Speaking speed (e.g. -4% is slightly slower than normal)"
        default: "-4%"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install edge-tts pillow pygments beautifulsoup4 lxml
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Build the video
        working-directory: video
        env:
          PAGE: ${{ github.event.inputs.page }}
          VOICE: ${{ github.event.inputs.voice }}
          RATE: ${{ github.event.inputs.rate }}
        run: python build_video.py "../$PAGE" --out ../out
      - name: Make a portal-sized copy (under 90 MB for the Worker upload limit)
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/tutorial.mp4)
          # total bitrate budget: 85 MB, minus 96 kbps audio
          VB=$(python3 -c "d=float('$DUR'); print(max(150,int((85*8*1024/d)-96)))")
          echo "duration=$DUR video_kbps=$VB"
          ffmpeg -y -i out/tutorial.mp4 -c:v libx264 -preset medium -b:v ${VB}k -maxrate ${VB}k -bufsize $((VB*2))k \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart out/tutorial-portal.mp4
          ls -l out/*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: numbers-tutorial
          path: |
            out/tutorial.mp4
            out/tutorial-portal.mp4
            out/subtitles.srt
            out/chapters.txt
            out/youtube_description.txt
            out/narration_script.txt
