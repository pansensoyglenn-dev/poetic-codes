# Save as .github/workflows/shrink-big-videos.yml, then Actions > "Shrink big videos" > Run workflow.
# Cloudflare Pages refuses to publish ANY file over 25 MiB, and one oversized file makes the WHOLE deployment fail.
# This re-encodes every videos/*.mp4 that is over 24 MB so it fits (same file name, so existing links keep working).
name: Shrink big videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Shrink every video over 24 MB
        run: |
          LIMIT=24000000
          for f in videos/*.mp4; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c %s "$f")
            if [ "$SIZE" -le "$LIMIT" ]; then continue; fi
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" | cut -d. -f1)
            [ -z "$DUR" ] && DUR=600
            # video bitrate (kbit/s) so that the whole file is about 21 MB
            VK=$(( (21000000 * 8 / DUR - 72000) / 1000 ))
            [ "$VK" -lt 120 ] && VK=120
            echo "== $f  ${SIZE} bytes, ${DUR}s -> video ${VK}k"
            for i in 1 2 3 4; do
              ffmpeg -y -loglevel error -i "$f" -vf "scale='min(1280,iw)':-2" -c:v libx264 -preset veryfast -crf 30 \
                -maxrate "${VK}k" -bufsize "$((VK*2))k" -pix_fmt yuv420p -c:a aac -b:a 64k -ac 1 -movflags +faststart /tmp/small.mp4
              NEW=$(stat -c %s /tmp/small.mp4)
              echo "   try $i: ${VK}k -> $NEW bytes"
              if [ "$NEW" -le "$LIMIT" ]; then break; fi
              VK=$(( VK * 80 / 100 ))
            done
            if [ "$NEW" -le "$LIMIT" ]; then mv /tmp/small.mp4 "$f"; else echo "COULD NOT shrink $f"; rm -f /tmp/small.mp4; fi
          done
          echo "Files still over the limit:"; find videos -name '*.mp4' -size +24M || true
      - name: Commit the smaller videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Shrink videos under 25 MiB so Cloudflare Pages can deploy"
          for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 5; done
