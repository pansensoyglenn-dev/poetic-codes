name: Essay videos
# One button, no inputs. Finds essays on the site that have no video, reads each one, makes a narrated video with an AI
# picture matched to every stretch of narration, and attaches it to the article. Poetic Bytes lesson pages are ignored
# (use the "Tutorial video" workflow for those). Job files live in a temporary folder, so nothing left in the repo can interfere.
on:
  schedule:
    - cron: "30 0 * * *"      # 08:30 Manila, just after Cloudflare's free daily allowance resets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essay-videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Use a temporary folder for job files
        run: echo "JOBS_DIR=$RUNNER_TEMP/essay-jobs" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install --quiet edge-tts pillow requests
      - name: Find essays without a video
        id: build
        env:
          TITLE: "*"
          MAX_VIDEOS: "1"
          QUIET_WHEN_EMPTY: "1"
        run: |
          echo "=== WORKFLOW: Essay videos (essay_video.py essay-v4) ==="
          python scripts/essay_jobs.py
      - name: Make the video
        if: steps.build.outputs.found != '0'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_IMAGES: "1"
          AI_IMAGE_MAX: "20"
          LLM_MAX_CALLS: "60"
          ARCHIVE_VIDEO: "0"
          STOCK_VIDEO: "0"
          KLING_ENABLED: "0"
          MAX_WORDS: "3000"
          TTS_RATE: "+0%"
          MAX_JOBS_PER_RUN: "1"
        run: python scripts/essay_video.py
      - name: Keep a downloadable copy
        if: always() && steps.build.outputs.found != '0'
        uses: actions/upload-artifact@v4
        with:
          name: essay-video
          path: out/*
          if-no-files-found: ignore
          retention-days: 3
