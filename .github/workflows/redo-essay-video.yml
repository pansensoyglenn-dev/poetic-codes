name: Redo essay video
# Type the exact title of an essay that already has a video; it is made again with the new picture pipeline.
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Exact essay title (several: separate with ;;)"
        required: true
      location:
        description: "Optional place, e.g. Zamboanga Sibugay, Philippines"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: essay-videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Use a temporary folder for job files
        run: echo "JOBS_DIR=$RUNNER_TEMP/essay-jobs" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install --quiet edge-tts pillow requests
      - name: Find essays without a video
        id: build
        env:
          TITLE: ${{ inputs.title }}
          LOCATION: ${{ inputs.location }}
          MAX_VIDEOS: "5"
        run: |
          echo "=== WORKFLOW: Redo essay video (essay_video.py essay-v4) ==="
          python scripts/essay_jobs.py
      - name: Make the video
        if: steps.build.outputs.found != '0'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_IMAGES: "1"
          AI_IMAGE_MAX: "20"
          LLM_MAX_CALLS: "60"
          ARCHIVE_VIDEO: "0"
          STOCK_VIDEO: "0"
          KLING_ENABLED: "0"
          MAX_WORDS: "3000"
          TTS_RATE: "+0%"
          MAX_JOBS_PER_RUN: "1"
          FORCE_REDO: "1"
        run: python scripts/essay_video.py
      - name: Keep a downloadable copy
        if: always() && steps.build.outputs.found != '0'
        uses: actions/upload-artifact@v4
        with:
          name: essay-video
          path: out/*
          if-no-files-found: ignore
          retention-days: 3
