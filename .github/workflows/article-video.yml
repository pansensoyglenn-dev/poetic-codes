name: Article video

on:
  push:
    branches: [main]
    paths:
      - 'video-jobs/*.json'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only make the video whose job file name contains this word (leave empty for all)'
        required: false
        default: ''

concurrency:
  group: article-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install --quiet edge-tts pillow requests

      - name: Make videos for pending jobs
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_IMAGES: "0"
          MAX_WORDS: "3000"
          TTS_RATE: "+0%"
          ONLY_JOB: ${{ github.event.inputs.only }}
        run: python scripts/make_article_video.py

      - name: Keep a downloadable copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-videos
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Save progress markers
        if: always()
        run: |
          git config user.name "article-video-bot"
          git config user.email "article-video-bot@users.noreply.github.com"
          mkdir -p /tmp/new-markers
          cp -r video-jobs/done/. /tmp/new-markers/ 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p video-jobs/done
            cp -r /tmp/new-markers/. video-jobs/done/ 2>/dev/null || true
            git add video-jobs/done 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No marker changes to save."
              exit 0
            fi
            git commit -m "Article videos processed [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); trying again."
            sleep 5
          done
          exit 1
