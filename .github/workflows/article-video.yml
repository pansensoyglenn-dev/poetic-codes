name: Article video

on:
  push:
    branches: [main]
    paths:
      - 'video-jobs/*.json'
  workflow_dispatch:

concurrency:
  group: article-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install --quiet edge-tts pillow requests

      - name: Make videos for pending jobs
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/make_article_video.py

      - name: Keep a downloadable copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-videos
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Save progress markers
        if: always()
        run: |
          git config user.name "article-video-bot"
          git config user.email "article-video-bot@users.noreply.github.com"
          git add video-jobs/done 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Article videos processed [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
