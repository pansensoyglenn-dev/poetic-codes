name: Tutorial video
# Make a narrated video from a Poetic Bytes tutorial page. Run it from Actions -> Run workflow and paste the page link.
# The finished .mp4 files and description files (link + YouTube chapters) are attached to the repo's "tutorial-videos" release
# (Code tab -> Releases) so each one downloads directly, and also kept as a zip under "Artifacts" at the bottom of the run.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Tutorial page link, e.g. https://poetic-bytes.vercel.app/shopping-cart.html"
        required: true
      explain:
        description: "Type 1 to let the free AI add a short spoken explanation to each code snippet (check it before publishing)"
        required: false
        default: ""
      check_only:
        description: "Type 1 to only list what the video WOULD contain (sections and code snippets) without making it - takes seconds"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet edge-tts pillow requests beautifulsoup4 pygments
      - name: Make the video
        env:
          PAGE: ${{ inputs.page }}
          EXPLAIN_CODE: ${{ inputs.explain == '1' && '1' || '0' }}
          OUTLINE_ONLY: ${{ inputs.check_only == '1' && '1' || '0' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/tutorial_video.py "$PAGE"
      - name: Attach the video to the article on the website
        if: ${{ inputs.check_only != '1' }}
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          OUT_DIR: out
          PAGE: ${{ inputs.page }}
        run: |
          NAME=$(ls out/*.mp4 2>/dev/null | head -1 | sed -E 's#out/##; s#\.mp4$##; s#--[0-9]{2}-.*$##')
          python scripts/tutorial_publish.py "$PAGE" "$NAME"
      - name: Keep the video
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-video
          path: out/*
          retention-days: 7
      - name: Attach the videos to the "tutorial-videos" release
        if: ${{ inputs.check_only != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.mp4 >/dev/null 2>&1 || { echo "No videos were made."; exit 0; }
          gh release view tutorial-videos >/dev/null 2>&1 || gh release create tutorial-videos --title "Tutorial videos" --notes "Narrated tutorial videos made from Poetic Bytes pages."
          gh release upload tutorial-videos out/*.mp4 out/*.description.txt --clobber
          echo "Download them from: ${{ github.server_url }}/${{ github.repository }}/releases/tag/tutorial-videos"
