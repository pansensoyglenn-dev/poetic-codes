name: SEO tools (check pages, build sitemap, ping IndexNow)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site address with no slash at the end"
        required: true
        default: "https://poetic-bytes.vercel.app"

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pages for indexing problems
        run: python scripts/seo_tools.py check --root . --site "${{ github.event.inputs.site }}"

      - name: Build sitemap.xml and robots.txt
        run: python scripts/seo_tools.py sitemap --root . --site "${{ github.event.inputs.site }}"

      - name: Tell Bing and Yandex (IndexNow)
        run: python scripts/seo_tools.py indexnow --root . --site "${{ github.event.inputs.site }}"

      - name: Save the new files in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt ./*.txt
          git diff --cached --quiet || git commit -m "Update sitemap, robots.txt and IndexNow key"
          git push
