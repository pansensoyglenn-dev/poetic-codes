name: Make article video
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Title(s) exactly as on the site. Several: separate with ;;  Every article without a video: type *"
        required: true
      location:
        description: "Where the story takes place, e.g. Iloilo City, early 1990s"
        required: false
        default: ""
      location_details:
        description: "Visual details: nipa huts, wet market, wooden banca boats"
        required: false
        default: ""
      max_videos:
        description: "When the title is *, how many articles to make this run (newest first)"
        required: false
        default: "10"
      characters:
        description: "Optional. name | description | words it appears with. Separate characters with ;;"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: article-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install --quiet edge-tts pillow requests
      - name: Build job file from inputs
        env:
          TITLE: ${{ inputs.title }}
          LOCATION: ${{ inputs.location }}
          LOCATION_DETAILS: ${{ inputs.location_details }}
          CHARACTERS: ${{ inputs.characters }}
          MAX_VIDEOS: ${{ inputs.max_videos }}
        run: python scripts/make_job_from_inputs.py
      - name: Make the video
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_IMAGES: "1"
          # FREE moving people: real stock footage from Pexels (free key at pexels.com/api, saved as a secret)
          STOCK_VIDEO: "1"
          STOCK_MAX_CLIPS: "20"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # People that really move (paid; each clip is billed by the provider). "0" = off, nothing is spent.
          KLING_ENABLED: "0"
          KLING_PROVIDER: "fal"
          KLING_MAX_CLIPS: "6"
          FAL_KEY: ${{ secrets.FAL_KEY }}
          MAX_WORDS: "3000"
          TTS_RATE: "+0%"
          MAX_JOBS_PER_RUN: "30"
        run: python scripts/make_article_video.py
      - name: Keep a downloadable copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-videos
          path: out/*
          if-no-files-found: ignore
          retention-days: 3
