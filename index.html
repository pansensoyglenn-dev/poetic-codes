<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvest Ledger · Plantation Expenditure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root{
    --bg-deep:#141f19;
    --bg-panel:#1a2921;
    --bg-card:#20342a;
    --bg-card-hi:#26402f;
    --ink:#efe8d6;
    --ink-dim:#a7b8a6;
    --ink-faint:#71847a;
    --gold:#d5a54a;
    --gold-soft:rgba(213,165,74,0.14);
    --clay:#c26a44;
    --leaf:#82ac5e;
    --maize:#dbb84a;
    --line:rgba(239,232,214,0.09);
    --line-strong:rgba(239,232,214,0.16);
    --shadow:0 18px 40px -20px rgba(0,0,0,0.65);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Public Sans',system-ui,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(213,165,74,0.08), transparent 60%),
      radial-gradient(ellipse 700px 600px at 100% 10%, rgba(130,172,94,0.07), transparent 55%),
      var(--bg-deep);
    color:var(--ink);
    min-height:100vh;
    padding:2.2rem 1.5rem 4rem;
  }
  .app{max-width:1320px;margin:0 auto;}

  /* ---------- HEADER ---------- */
  .app-header{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
    padding-bottom:1.4rem;margin-bottom:1.8rem;border-bottom:1px solid var(--line-strong);
  }
  .brand{display:flex;align-items:baseline;gap:0.7rem;}
  .brand .mark{
    font-family:'Fraunces',serif;font-weight:700;font-size:1rem;letter-spacing:0.06em;
    color:var(--bg-deep);background:var(--gold);padding:0.28rem 0.6rem;border-radius:4px;
  }
  .brand h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;letter-spacing:-0.01em;color:var(--ink);
  }
  .brand h1 em{font-style:italic;font-weight:500;color:var(--ink-dim);}
  .today-chip{
    font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--ink-dim);
    border:1px solid var(--line-strong);padding:0.4rem 0.9rem;border-radius:100px;
    display:flex;align-items:center;gap:0.5rem;
  }
  .today-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--leaf);box-shadow:0 0 8px var(--leaf);}

  /* ---------- LAYOUT ---------- */
  .layout{display:grid;grid-template-columns:250px 1fr;gap:1.8rem;}
  @media (max-width:880px){.layout{grid-template-columns:1fr;}}

  /* ---------- NAV ---------- */
  .nav{position:relative;}
  .nav-group{margin-bottom:1.6rem;}
  .nav-label{
    font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 0.6rem;margin-bottom:0.55rem;
  }
  .nav-btn{
    width:100%;display:flex;align-items:center;gap:0.75rem;
    background:transparent;border:none;color:var(--ink-dim);
    font-family:'Public Sans',sans-serif;font-weight:500;font-size:0.88rem;
    padding:0.58rem 0.7rem;border-radius:10px;cursor:pointer;text-align:left;
    transition:background .12s, color .12s;margin-bottom:2px;
  }
  .nav-btn i{width:1.1rem;text-align:center;font-size:0.92rem;color:var(--ink-faint);}
  .nav-btn:hover{background:var(--bg-card);color:var(--ink);}
  .nav-btn.active{background:var(--gold-soft);color:var(--gold);}
  .nav-btn.active i{color:var(--gold);}
  .nav-btn.danger:hover{background:rgba(194,106,68,0.15);color:var(--clay);}
  .nav-btn.danger:hover i{color:var(--clay);}
  .crop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;
    padding:1.9rem 2rem;box-shadow:var(--shadow);min-height:560px;
  }
  .panel-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:0.8rem;margin-bottom:1.6rem;}
  .panel-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;color:var(--ink);}
  .panel-hint{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--ink-faint);}

  /* ---------- OVERVIEW HERO ---------- */
  .ledger-hero{
    border:1px solid var(--line-strong);border-radius:16px;padding:1.6rem 1.8rem;margin-bottom:1.8rem;
    background:linear-gradient(135deg, rgba(213,165,74,0.07), transparent 60%);
    position:relative;overflow:hidden;
  }
  .ledger-hero::before{
    content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle, rgba(213,165,74,0.12), transparent 70%);
  }
  .ledger-hero .as-of{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--ink-faint);margin-bottom:1rem;}
  .ledger-hero .as-of strong{color:var(--gold);}
  .hero-row{display:flex;flex-wrap:wrap;gap:2.2rem;}
  .hero-stat .num{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;color:var(--ink);}
  .hero-stat .num.gold{color:var(--gold);}
  .hero-stat .lbl{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);margin-top:0.15rem;}

  /* ---------- RECORD CARD (ledger stub) ---------- */
  .record-card{
    position:relative;display:flex;background:var(--bg-card);border:1px solid var(--line);
    border-radius:14px;margin-bottom:0.9rem;overflow:hidden;transition:transform .14s, background .14s;
  }
  .record-card:hover{transform:translateX(3px);background:var(--bg-card-hi);}
  .stub{
    width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.3rem;
    border-right:1px dashed var(--line-strong);position:relative;
  }
  .stub i{font-size:1.05rem;}
  .stub .rid{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:var(--ink-faint);}
  .record-body{flex:1;padding:0.95rem 1.2rem;}
  .record-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem;}
  .record-plant{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--ink);}
  .record-date{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-faint);}
  .record-meta{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:0.82rem;color:var(--ink-dim);margin-bottom:0.5rem;}
  .record-meta i{color:var(--ink-faint);margin-right:0.3rem;width:1rem;text-align:center;}
  .record-total{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold);}
  .tag-row{display:flex;flex-wrap:wrap;gap:0.35rem;}
  .tag{
    font-size:0.72rem;background:rgba(239,232,214,0.05);border:1px solid var(--line);
    padding:0.18rem 0.65rem;border-radius:100px;color:var(--ink-dim);
  }

  /* crop accent colors */
  .crop-coconut .stub{background:rgba(213,165,74,0.12);} .crop-coconut .stub i{color:var(--gold);} .crop-coconut{border-left:3px solid var(--gold);}
  .crop-lanzones .stub{background:rgba(130,172,94,0.12);} .crop-lanzones .stub i{color:var(--leaf);} .crop-lanzones{border-left:3px solid var(--leaf);}
  .crop-durian .stub{background:rgba(194,106,68,0.12);} .crop-durian .stub i{color:var(--clay);} .crop-durian{border-left:3px solid var(--clay);}
  .crop-maize .stub{background:rgba(219,184,74,0.12);} .crop-maize .stub i{color:var(--maize);} .crop-maize{border-left:3px solid var(--maize);}

  /* ---------- EMPTY STATE ---------- */
  .empty{text-align:center;padding:3.4rem 1rem;color:var(--ink-faint);}
  .empty i{font-size:2.4rem;opacity:0.4;margin-bottom:0.9rem;display:block;color:var(--gold);}
  .empty p{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--ink-dim);margin-bottom:0.3rem;}
  .empty span{font-size:0.85rem;}

  /* ---------- FORMS ---------- */
  .field{margin-bottom:1.1rem;}
  .field label{display:block;font-size:0.78rem;color:var(--ink-dim);margin-bottom:0.4rem;font-weight:500;}
  .field input, .field select{
    width:100%;padding:0.65rem 0.95rem;border-radius:10px;border:1px solid var(--line-strong);
    background:var(--bg-deep);color:var(--ink);font-family:'Public Sans',sans-serif;font-size:0.9rem;outline:none;
    transition:border-color .12s;
  }
  .field input::placeholder{color:var(--ink-faint);}
  .field input:focus, .field select:focus{border-color:var(--gold);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .inline-form{display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center;margin-bottom:0.8rem;}
  .inline-form input{
    padding:0.55rem 0.85rem;border-radius:10px;border:1px solid var(--line-strong);
    background:var(--bg-deep);color:var(--ink);font-size:0.85rem;outline:none;
  }
  .inline-form input:focus{border-color:var(--gold);}

  .btn{
    padding:0.6rem 1.4rem;border-radius:10px;font-weight:600;font-size:0.85rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:0.5rem;border:1px solid var(--line-strong);
    background:transparent;color:var(--ink-dim);transition:all .12s;font-family:'Public Sans',sans-serif;
  }
  .btn:hover{border-color:var(--line-strong);color:var(--ink);background:var(--bg-card);}
  .btn-primary{background:var(--gold);color:#1a1406;border-color:var(--gold);}
  .btn-primary:hover{background:#e2b45c;color:#1a1406;}
  .btn-danger{background:rgba(194,106,68,0.16);color:var(--clay);border-color:rgba(194,106,68,0.3);}
  .btn-danger:hover{background:rgba(194,106,68,0.28);}
  .btn-sm{padding:0.4rem 0.9rem;font-size:0.78rem;}

  hr{border:none;border-top:1px dashed var(--line-strong);margin:1.4rem 0;}
  h4.section-h{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);font-size:1rem;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem;}
  h4.section-h i{color:var(--gold);font-size:0.9rem;}

  .pill-worker, .pill-item{
    display:inline-flex;align-items:center;gap:0.4rem;background:var(--bg-deep);border:1px solid var(--line-strong);
    padding:0.3rem 0.8rem;border-radius:100px;font-size:0.78rem;color:var(--ink-dim);margin:0.2rem 0.3rem 0.2rem 0;
  }
  .pill-worker i.remove, .pill-item i.remove{color:var(--clay);cursor:pointer;margin-left:0.2rem;}

  /* ---------- STAT GRID ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem;background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:1.3rem 1.5rem;margin-bottom:1.4rem;}
  .stat-cell .num{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;color:var(--gold);}
  .stat-cell .lbl{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-faint);margin-top:0.1rem;}

  .worker-row{
    background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:0.75rem 1.1rem;margin-bottom:0.55rem;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;
  }
  .worker-row .who{font-weight:600;color:var(--ink);}
  .worker-row .job{color:var(--ink-faint);font-size:0.8rem;font-weight:400;margin-left:0.4rem;}
  .worker-row .figs{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;color:var(--ink-dim);}

  .scrollable{max-height:520px;overflow-y:auto;padding-right:8px;}
  .scrollable::-webkit-scrollbar{width:5px;}
  .scrollable::-webkit-scrollbar-track{background:transparent;}
  .scrollable::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;}

  .fade-in{animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .item-cost-line{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:0.88rem;}
  .item-cost-line b{color:var(--ink);font-weight:500;}
  .item-cost-line .cost{font-family:'IBM Plex Mono',monospace;color:var(--gold);}

  .loading-veil{display:flex;align-items:center;gap:0.6rem;color:var(--ink-faint);font-size:0.85rem;padding:2rem;justify-content:center;}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--gold);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:600px){
    .panel{padding:1.3rem;}
    .brand h1{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <div class="brand">
      <span class="mark">HL</span>
      <h1>Harvest <em>Ledger</em></h1>
    </div>
    <div class="today-chip"><span class="dot"></span><span id="recordCounter">loading…</span></div>
  </header>

  <div class="layout">
    <nav class="nav" id="navPanel">
      <div class="nav-group">
        <div class="nav-label">Record a harvest</div>
        <button class="nav-btn" data-action="addCoconut"><span class="crop-dot" style="background:var(--gold)"></span>Coconut</button>
        <button class="nav-btn" data-action="addLanzones"><span class="crop-dot" style="background:var(--leaf)"></span>Lanzones</button>
        <button class="nav-btn" data-action="addDurian"><span class="crop-dot" style="background:var(--clay)"></span>Durian</button>
        <button class="nav-btn" data-action="addMaize"><span class="crop-dot" style="background:var(--maize)"></span>Maize</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Browse</div>
        <button class="nav-btn" data-action="viewAll"><i class="fas fa-layer-group"></i>All records</button>
        <button class="nav-btn" data-action="search"><i class="fas fa-magnifying-glass"></i>Search</button>
        <button class="nav-btn" data-action="byDate"><i class="fas fa-calendar-day"></i>By date</button>
        <button class="nav-btn" data-action="byDateRange"><i class="fas fa-calendar-week"></i>Date range</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Reports</div>
        <button class="nav-btn" data-action="stats"><i class="fas fa-chart-simple"></i>Statistics</button>
        <button class="nav-btn" data-action="itemsByDate"><i class="fas fa-box"></i>Items by date</button>
        <button class="nav-btn" data-action="fullSummary"><i class="fas fa-scroll"></i>Full summary</button>
        <button class="nav-btn" data-action="workerHistory"><i class="fas fa-user-clock"></i>Worker history</button>
        <button class="nav-btn" data-action="workerSummary"><i class="fas fa-people-group"></i>Worker summary</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">System</div>
        <button class="nav-btn" data-action="exportCsv"><i class="fas fa-file-export"></i>Export CSV</button>
        <button class="nav-btn danger" data-action="deleteRecord"><i class="fas fa-trash-can"></i>Delete record</button>
        <button class="nav-btn" data-action="clear"><i class="fas fa-rotate-left"></i>Clear view</button>
      </div>
    </nav>

    <section class="panel">
      <div class="panel-head">
        <h2 id="panelTitle">Overview</h2>
        <span class="panel-hint" id="actionHint">select an action from the ledger</span>
      </div>
      <div id="dynamicContent" class="fade-in">
        <div class="loading-veil"><div class="spin"></div> reading the ledger…</div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";

  let records = [];
  let nextId = 1;
  const DEFAULT_WAGE = 350.0;
  const STORAGE_KEY = 'plantation-records';

  const CROP_META = {
    'Coconut Plantation':   {icon:'fa-tree', cls:'crop-coconut'},
    'Lanzones Plantation':  {icon:'fa-leaf', cls:'crop-lanzones'},
    'Durian Plantation':    {icon:'fa-seedling', cls:'crop-durian'},
    'Maize Production':     {icon:'fa-wheat-awn', cls:'crop-maize'}
  };
  function cropMeta(type){ return CROP_META[type] || {icon:'fa-tractor', cls:'crop-coconut'}; }

  async function loadFromStorage(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(Array.isArray(parsed)){
          records = parsed;
          if(records.length){
            nextId = records.reduce((m,r)=>Math.max(m, r.id||0), 0) + 1;
          }
        }
      }
    }catch(e){ /* no data yet */ }
  }

  async function saveToStorage(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(records), false); }
    catch(e){ console.error('Storage save failed', e); }
  }

  function getTodayStr(){ return new Date().toISOString().slice(0,10); }
  function formatCurrency(v){ return '\u20b1' + Number(v||0).toFixed(2); }
  function round2(v){ return Math.round(v*100)/100; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function calcWorkerCost(w){
    const days = (w.fullDays||0) + (w.halfDays||0)*0.5;
    return round2(days * (w.dailyWage || DEFAULT_WAGE));
  }

  function calcRecordTotals(record){
    const workers = record.workers || [];
    let labor=0, fullDays=0, halfDays=0;
    workers.forEach(w=>{
      fullDays += (w.fullDays||0);
      halfDays += (w.halfDays||0);
      labor += calcWorkerCost(w);
    });
    const items = record.items || [];
    let itemsTotal = 0;
    items.forEach(it=>{ itemsTotal += (it.cost||0); });
    record.laborCost = round2(labor);
    record.itemsTotal = round2(itemsTotal);
    record.totalExpenditure = round2(labor+itemsTotal);
    record.totalWorkers = workers.length;
    record.fullDays = round2(fullDays);
    record.halfDays = round2(halfDays);
    if(!record.dailyWage) record.dailyWage = DEFAULT_WAGE;
    return record;
  }

  function createRecord(plantationType, data){
    const id = nextId++;
    const rec = {
      id, plantationType, date: data.date || getTodayStr(),
      workers: data.workers || [], items: data.items || [],
      dailyWage: data.dailyWage || DEFAULT_WAGE,
      laborCost:0, itemsTotal:0, totalExpenditure:0, totalWorkers:0, fullDays:0, halfDays:0
    };
    calcRecordTotals(rec);
    return rec;
  }

  async function addRecord(rec){ records.push(rec); await saveToStorage(); return rec.id; }
  async function deleteRecordById(id){
    const idx = records.findIndex(r=>r.id===id);
    if(idx===-1) return false;
    records.splice(idx,1);
    await saveToStorage();
    return true;
  }
  function getRecord(id){ return records.find(r=>r.id===id); }

  function searchRecords(filters){
    let res = records;
    if(filters.plantationType) res = res.filter(r=>r.plantationType && r.plantationType.toLowerCase().includes(filters.plantationType.toLowerCase()));
    if(filters.dateFrom) res = res.filter(r=>r.date >= filters.dateFrom);
    if(filters.dateTo) res = res.filter(r=>r.date <= filters.dateTo);
    if(filters.minCost !== undefined) res = res.filter(r=>(r.totalExpenditure||0) >= filters.minCost);
    if(filters.maxCost !== undefined) res = res.filter(r=>(r.totalExpenditure||0) <= filters.maxCost);
    if(filters.workerName){
      const name = filters.workerName.toLowerCase();
      res = res.filter(r=>(r.workers||[]).some(w=>w.name && w.name.toLowerCase().includes(name)));
    }
    return res;
  }

  function getWorkerHistory(name){
    const lower = name.toLowerCase();
    const result = [];
    records.forEach(r=>{
      (r.workers||[]).forEach(w=>{
        if(w.name && w.name.toLowerCase().includes(lower)){
          result.push({ date:r.date, recordId:r.id, name:w.name, job:w.jobDescription||'General Labor',
            fullDays:w.fullDays||0, halfDays:w.halfDays||0, dailyWage:w.dailyWage||r.dailyWage||DEFAULT_WAGE, laborCost:calcWorkerCost(w) });
        }
      });
    });
    return result;
  }

  function getWorkerSummaryByDate(date){
    const dayRecords = records.filter(r=>r.date===date);
    if(!dayRecords.length) return null;
    const summary = {}; let totalLabor=0;
    dayRecords.forEach(r=>{
      (r.workers||[]).forEach(w=>{
        const name = w.name || 'Unknown';
        if(!summary[name]) summary[name] = {job:w.jobDescription||'General Labor', fullDays:0, halfDays:0, laborCost:0, records:[]};
        summary[name].fullDays += (w.fullDays||0);
        summary[name].halfDays += (w.halfDays||0);
        const cost = calcWorkerCost(w);
        summary[name].laborCost += cost;
        summary[name].records.push(r.id);
        totalLabor += cost;
      });
    });
    return {date, workerSummary:summary, totalLaborCost: round2(totalLabor)};
  }

  function getFullSummaryByDate(date){
    const dayRecords = records.filter(r=>r.date===date);
    if(!dayRecords.length) return null;
    let totalLabor=0, totalItems=0; const items=[]; const workerSummary={};
    dayRecords.forEach(r=>{
      totalLabor += (r.laborCost||0); totalItems += (r.itemsTotal||0);
      (r.items||[]).forEach(it=>items.push({name:it.name, cost:it.cost, recordId:r.id, plantation:r.plantationType}));
      (r.workers||[]).forEach(w=>{
        const name = w.name || 'Unknown';
        if(!workerSummary[name]) workerSummary[name] = {job:w.jobDescription||'General Labor', fullDays:0, halfDays:0, laborCost:0, records:[]};
        workerSummary[name].fullDays += (w.fullDays||0);
        workerSummary[name].halfDays += (w.halfDays||0);
        workerSummary[name].laborCost += calcWorkerCost(w);
        workerSummary[name].records.push(r.id);
      });
    });
    return {date, recordCount:dayRecords.length, totalLaborCost:round2(totalLabor), totalItemsCost:round2(totalItems),
      totalExpenditure: round2(totalLabor+totalItems), items, workerSummary};
  }

  function getStatistics(){
    if(!records.length) return null;
    let totalCost=0, totalLabor=0, totalItems=0, totalWorkers=0;
    records.forEach(r=>{ totalCost+=(r.totalExpenditure||0); totalLabor+=(r.laborCost||0); totalItems+=(r.itemsTotal||0); totalWorkers+=(r.workers||[]).length; });
    const costs = records.map(r=>r.totalExpenditure||0);
    const workerMap = {};
    records.forEach(r=>{
      (r.workers||[]).forEach(w=>{
        const name = w.name || 'Unknown';
        if(!workerMap[name]) workerMap[name] = {laborCost:0, records:0, jobs:new Set()};
        workerMap[name].laborCost += calcWorkerCost(w);
        workerMap[name].records += 1;
        if(w.jobDescription) workerMap[name].jobs.add(w.jobDescription);
      });
    });
    const topWorkers = Object.entries(workerMap).sort((a,b)=>b[1].laborCost-a[1].laborCost).slice(0,10)
      .map(([name,data])=>({name, laborCost:round2(data.laborCost), records:data.records, jobs:Array.from(data.jobs).slice(0,2)}));
    return {
      totalRecords: records.length, totalCost: round2(totalCost), totalLaborCost: round2(totalLabor),
      totalItemsCost: round2(totalItems), totalWorkers, averageCost: round2(totalCost/records.length),
      maxCost: round2(Math.max(...costs)), minCost: round2(Math.min(...costs)), topWorkers
    };
  }

  function getExpendituresByDate(date){
    const dayRecords = records.filter(r=>r.date===date);
    if(!dayRecords.length) return null;
    let labor=0, items=0;
    dayRecords.forEach(r=>{ labor+=(r.laborCost||0); items+=(r.itemsTotal||0); });
    return {date, recordCount:dayRecords.length, totalLaborCost:round2(labor), totalItemsCost:round2(items), totalExpenditure:round2(labor+items), records:dayRecords};
  }

  function getExpendituresUpToToday(){
    const today = getTodayStr();
    const filtered = records.filter(r=>r.date <= today);
    if(!filtered.length) return null;
    let totalLabor=0, totalItems=0, totalCost=0;
    filtered.forEach(r=>{ totalLabor+=(r.laborCost||0); totalItems+=(r.itemsTotal||0); totalCost+=(r.totalExpenditure||0); });
    return {recordCount:filtered.length, totalLabor:round2(totalLabor), totalItems:round2(totalItems), totalExpenditure:round2(totalCost), today};
  }

  function exportCSV(){
    if(!records.length){ alert('No records to export'); return; }
    let csv = 'ID,Date,Plantation,Worker,Job,FullDays,HalfDays,DailyWage,LaborCost,ItemsTotal,Total\n';
    records.forEach(r=>{
      const workers = r.workers || [];
      if(workers.length){
        workers.forEach(w=>{
          csv += `${r.id},${r.date},"${r.plantationType}","${w.name||''}","${w.jobDescription||''}",${w.fullDays||0},${w.halfDays||0},${w.dailyWage||r.dailyWage||DEFAULT_WAGE},${calcWorkerCost(w)},${r.itemsTotal||0},${r.totalExpenditure||0}\n`;
        });
      } else {
        csv += `${r.id},${r.date},"${r.plantationType}",,,0,0,${r.dailyWage||DEFAULT_WAGE},0,${r.itemsTotal||0},${r.totalExpenditure||0}\n`;
      }
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'plantation_export.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

          case 'addLanzones': showAddForm('Lanzones Plantation'); break;
          case 'addDurian': showAddForm('Durian Plantation'); break;
          case 'addMaize': showAddForm('Maize Production'); break;
          case 'viewAll': showAllRecords(); break;
          case 'search': showSearch(); break;
          case 'stats': showStatistics(); break;
          case 'byDate': showByDate(); break;
          case 'byDateRange': showDateRange(); break;
          case 'itemsByDate': showItemsByDate(); break;
          case 'fullSummary': showFullSummary(); break;
          case 'workerHistory': showWorkerHistory(); break;
          case 'workerSummary': showWorkerSummaryByDate(); break;
          case 'deleteRecord': deleteRecordFlow(); break;
          case 'exportCsv': exportCSV(); break;
          case 'clear': showTodayDashboard(); break;
          default: showTodayDashboard();
        }
      });
    });
  }

  async function init(){
    await loadFromStorage();
    updateCounter();
    showTodayDashboard();
    initMenu();
  }
  init();

})();
</script>
